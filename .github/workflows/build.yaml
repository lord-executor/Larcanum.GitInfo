name: .NET Build

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    SOLUTION_FILE: src/GitInfo.slnx

jobs:
    build:

        runs-on: ubuntu-latest

        steps:
            # Checkout the repository
            -   name: Checkout code
                uses: actions/checkout@v5
                with:
                    # Tags aren't fetched by default, but we want them so that we can have a basic unit test for
                    # the GitInfo.Tag property. The "fetch-tags" configuration doesn't actually _fetch_ the tags, it
                    # just _allows_ tags to be fetched, but with a fetch-depth of 0 (everything) we get tags included
                    fetch-depth: 0

            # Setup .NET Core SDK
            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    global-json-file: global.json
                    cache: true
                    cache-dependency-path: src/**/*.csproj

            -   name: Restore dependencies
                run: dotnet restore $SOLUTION_FILE

            -   name: Build
                run: dotnet build --no-restore $SOLUTION_FILE

            -   name: Verify formatting
                run: dotnet format --no-restore $SOLUTION_FILE --verify-no-changes --verbosity diagnostic

            -   name: Test
                run: dotnet test --no-build --verbosity normal --solution $SOLUTION_FILE

            -   name: Run GitInfo.Out
                run: dotnet run --no-build --project src/GitInfo.Out/GitInfo.Out.csproj
