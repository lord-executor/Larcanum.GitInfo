name: Publish

on:
    push:
        tags:
            - "v*.*.*"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

env:
    SOLUTION_FILE: src/GitInfo.slnx
    PACKAGE_PROJECT: src/GitInfo/GitInfo.csproj

jobs:
    publish:

        runs-on: ubuntu-latest

        permissions:
            contents: read
            # Required so GitHub can issue the OIDC token that NuGet.org exchanges for a short-lived API key
            # (Trusted Publishing, see https://aka.ms/nuget/trusted-publishing)
            id-token: write

        steps:
            -   name: Checkout code
                uses: actions/checkout@v5
                with:
                    # Full history and tags: needed for the GitInfo.Tag unit test and for git describe to
                    # resolve the version this generator embeds into itself
                    fetch-depth: 0

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    global-json-file: global.json
                    cache: true
                    cache-dependency-path: src/**/*.csproj

            -   name: Determine package version
                id: version
                # GITHUB_REF_NAME is the pushed tag, e.g. "v1.4.0" - strip the leading "v" for the NuGet version
                run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

            -   name: Restore dependencies
                run: dotnet restore $SOLUTION_FILE

            -   name: Build
                run: dotnet build --no-restore -c Release $SOLUTION_FILE

            -   name: Verify formatting
                run: dotnet format --no-restore $SOLUTION_FILE --verify-no-changes --verbosity diagnostic

            -   name: Test
                run: dotnet test --no-build -c Release --verbosity normal --solution $SOLUTION_FILE

            -   name: Run GitInfo.Out
                run: dotnet run --no-build -c Release --project src/GitInfo.Out/GitInfo.Out.csproj

            -   name: Pack
                run: >
                    dotnet pack $PACKAGE_PROJECT
                    -c Release
                    -p:Version=${{ steps.version.outputs.version }}
                    -o artifacts

            -   name: NuGet login (OIDC -> temporary API key)
                uses: NuGet/login@v1
                id: login
                with:
                    user: ${{ secrets.NUGET_USER }}

            -   name: NuGet push
                # Pushing the .nupkg by its exact path makes dotnet nuget push discover and push the
                # matching .snupkg from the same directory automatically.
                run: >
                    dotnet nuget push artifacts/Larcanum.GitInfo.${{ steps.version.outputs.version }}.nupkg
                    --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
                    --source https://api.nuget.org/v3/index.json
                    --skip-duplicate
